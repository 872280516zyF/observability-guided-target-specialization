seed: 42

use_cgan: false
use_joint_training: false
joint_alpha: 1.0

data:
  train_manifest: "data/images3/label_train.csv"
  val_manifest: "data/images3/label_val.csv"
  before_dir: "data/images3/before"
  after_dir: "data/images3/after"
  pattern_dir: "data/images3/patterns"
  pattern_manifest: "data/images3/patterns/pattern_manifest.csv"
  label_stats: "configs/label_stats.yaml"

model:
  type: "pix2pixhd"
  use_local_enhancer: true
  base_channels: 64
  local_channels: 32
  num_scales: 2

optimizer:
  lr: 8e-5
  beta1: 0.9
  beta2: 0.999
  weight_decay: 5e-4

trainer:
  epochs: 50
  batch_size: 16
  num_workers: 8
  save_dir: "checkpoints/forward_5090_l1_proxy"
  amp: true

  eval_freq: 2
  save_samples: true
  num_eval_samples: 12
  early_stopping_patience: 12

  use_combined_loss: true
  lambda_l1: 1.5
  lambda_ssim: 0.2
  lambda_perceptual: 0.2

  analyze_hard_samples: false
  hard_samples_topk: 20

transforms:
  resize: [164, 374]
  augment: false
